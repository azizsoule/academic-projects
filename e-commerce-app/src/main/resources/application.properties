################### JavaMail Configuration ##########################
support.email=cash.loyalty.app@gmail.com

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=cash.loyalty.app@gmail.com
spring.mail.password=CHANGE_ME

# Other properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# TLS , port 587
spring.mail.properties.mail.smtp.starttls.enable=true

# SSL, post 465
spring.mail.properties.mail.smtp.socketFactory.port = 465
spring.mail.properties.mail.smtp.socketFactory.class = javax.net.ssl.SSLSocketFactory
################### Oracle Database Configuration ##########################
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:bdoracle
spring.datasource.username=ano
spring.datasource.password=CHANGE_ME
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.database-platform=oracle
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect