<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/base-layout}">
<th:block layout:fragment="content">
    <main>
        <div class="container-fluid">
            <h2 class="mt-30 page-title">Categories</h2>
            <ol class="breadcrumb mb-30">
                <li class="breadcrumb-item"><a href="index.html">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="category.html">Categories</a></li>
                <li class="breadcrumb-item active">Add Category</li>
            </ol>
            <div class="row">
                <div class="col-lg-6 col-md-6">
                    <div class="card card-static-2 mb-30">
                        <div class="card-title-2">
                            <h4>Add New Category</h4>
                        </div>
                        <div class="card-body-table">
                            <form method="post" th:object="${categoryDTO}" th:action="@{save}">
                                <div class="news-content-right pd-20">
                                    <div class="form-group">
                                        <label class="form-label" th:field="*{label}">Name*</label>
                                        <input type="text" class="form-control" placeholder="Category Name">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Category Image*</label>
                                        <div class="input-group">
                                            <div class="custom-file">
                                                <input type="file" class="custom-file-input" th:field="*{image}"
                                                       aria-describedby="inputGroupFileAddon04">
                                                <label class="custom-file-label" for="image">Choose
                                                    Image</label>
                                            </div>
                                        </div>
                                        <div class="add-cate-img">
                                            <img src="images/category/icon-1.svg" alt="">
                                        </div>
                                    </div>
                                    <button class="save-btn hover-btn" type="submit">Add New Category</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</th:block>

</html>
